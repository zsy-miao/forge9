[package]
name = "forge9"
version = "0.1.0"
edition = "2024"
description = "General-purpose toolkit for RPF9 archives — read, decrypt, inspect, extract and analyze"
license = "MIT"
repository = "https://github.com/nineforge0/forge9"
keywords = ["rpf9", "archive", "toolkit", "extraction"]

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
toml = "1"
bcpack-rs = { git = "https://github.com/Ahmet-Dedeler/bcpack-rs", rev = "c55c5fad539644b8cf5a705051df214291763fc0", default-features = false, features = ["ttpf"] }
bcdec_rs = "0.2.1"
